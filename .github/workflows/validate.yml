name: Validate isolated IEQ Sede application

on:
  push:
    branches: [work/base-ieqsede]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_DATABASE: ieqsede_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1 -u root -pdisposable-ci-only --silent"
          --health-start-period=30s --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:security
      - run: npm test -- tests/permissions.test.ts tests/session-storage.test.ts
      - run: npm run build
      - run: test -f dist/index.js && test -f dist/app/index.html
      - name: MySQL integration with disposable data
        run: node --import tsx --test tests/mysql.integration.ts
        env:
          IEQ_TEST_DATABASE_URL: mysql://root:disposable-ci-only@127.0.0.1:3306/ieqsede_test
